<!DOCTYPE html>
<html lang="en">
<head>

    <title>Shopping Cart - Fresh Dairy</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">

            <div class="nav-links">
