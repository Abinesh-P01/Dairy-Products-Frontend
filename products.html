<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Lumina</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img class="logo-icon" src="logo.jpg" alt="Lumina">
                Lumina
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="my-orders.html">My Orders</a>
                <a href="support.html">Support</a>
                <a href="index.html#about">About Us</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <div class="nav-actions">
                <span id="nav-auth-link"><a href="login.html">Login</a></span>
                <a href="admin/login.html" class="btn btn-sm btn-secondary">Admin</a>
                <a href="cart.html" class="cart-icon">
                    &#128722;
                    <span class="cart-badge">0</span>
                </a>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>Our Products</h1>
        <p>Explore our range of fresh, quality dairy products</p>
    </div>

    <!-- Filter Bar -->
    <section class="section" style="padding-bottom:0;">
        <div class="container">
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search products..." oninput="searchProducts()">
                </div>
                <div class="price-filter">
                    <input type="number" id="min-price" placeholder="Min ₹" min="0">
                    <span>-</span>
                    <input type="number" id="max-price" placeholder="Max ₹" min="0">
                    <button class="btn btn-primary btn-sm" onclick="filterProductsByPrice()">Filter</button>
                </div>
                <select class="sort-select" id="sort-select" onchange="sortProducts()">
                    <option value="default">Sort: Default</option>
                    <option value="asc">Price: Low to High</option>
                    <option value="desc">Price: High to Low</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="section">
        <div class="container">
            <div id="products-grid" class="products-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading products...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Lumina. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/user.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
