<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Fresh Dairy Admin</title>
    <link rel="icon" href="../logo.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <img class="logo-icon" src="../logo.jpg" alt="Lumina">
                Fresh Dairy
            </a>
            <div class="nav-links">
                <a href="../index.html">Store</a>
            </div>
            <div class="nav-actions">
                <span style="font-size:0.9rem;color:var(--text-light);">Admin Panel</span>
                <a href="../cart.html" class="cart-icon">
                    &#128722;
                    <span class="cart-badge">0</span>
                </a>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h3>Admin Panel</h3>
                <p>Welcome, Admin</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="nav-icon">&#128202;</span>
                    Dashboard
                </a>
                <a href="products.html">
                    <span class="nav-icon">&#128230;</span>
                    Products
                </a>
                <a href="add-product.html">
                    <span class="nav-icon">&#10133;</span>
                    Add Product
                </a>
                <a href="orders.html" class="active">
                    <span class="nav-icon">&#128196;</span>
                    Orders
                </a>
                <a href="support.html">
                    <span class="nav-icon">&#128172;</span>
                    Support
                </a>
                <a href="add-admin.html">
                    <span class="nav-icon">&#128101;</span>
                    Add Admin
                </a>
                <a href="#" class="logout" onclick="adminLogout()">
                    <span class="nav-icon">&#128682;</span>
                    Logout
                </a>
            </nav>
        </aside>

        <!-- Mobile Sidebar Toggle -->
        <button class="admin-sidebar-toggle" onclick="toggleAdminSidebar()">&#9776;</button>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Orders</h1>
                <p>View and manage customer orders</p>
            </div>

            <!-- Orders Table -->
            <div class="admin-table-container">
                <div class="admin-table-header">
                    <h2>All Orders</h2>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Address</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-body">
                            <tr>
                                <td colspan="6" class="text-center" style="padding:2rem;">
                                    <div class="loading">
                                        <div class="spinner"></div>
                                        <p>Loading orders...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
