<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Messages - Fresh Dairy Admin</title>
    <link rel="icon" href="../logo.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="../index.html" class="logo">
                <img class="logo-icon" src="../logo.jpg" alt="Lumina">
                Fresh Dairy
            </a>
            <div class="nav-links">
                <a href="../index.html">Store</a>
            </div>
            <div class="nav-actions">
                <span style="font-size:0.9rem;color:var(--text-light);">Admin Panel</span>
                <a href="../cart.html" class="cart-icon">
                    &#128722;
                    <span class="cart-badge">0</span>
                </a>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h3>Admin Panel</h3>
                <p>Welcome, Admin</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="nav-icon">&#128202;</span>
                    Dashboard
                </a>
                <a href="products.html">
                    <span class="nav-icon">&#128230;</span>
                    Products
                </a>
                <a href="add-product.html">
                    <span class="nav-icon">&#10133;</span>
                    Add Product
                </a>
                <a href="orders.html">
                    <span class="nav-icon">&#128196;</span>
                    Orders
                </a>
                <a href="support.html" class="active">
                    <span class="nav-icon">&#128172;</span>
                    Support
                </a>
                <a href="add-admin.html">
                    <span class="nav-icon">&#128101;</span>
                    Add Admin
                </a>
                <a href="#" class="logout" onclick="adminLogout()">
                    <span class="nav-icon">&#128682;</span>
                    Logout
                </a>
            </nav>
        </aside>

        <!-- Mobile Sidebar Toggle -->
        <button class="admin-sidebar-toggle" onclick="toggleAdminSidebar()">&#9776;</button>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Support Messages</h1>
                <p>View and reply to customer support messages</p>
            </div>

            <div class="admin-table-container">
                <div class="admin-table-header">
                    <h2>All Messages</h2>
                    <button class="btn btn-secondary btn-sm" onclick="fetchAllSupportMessages()">Refresh</button>
                </div>
                <div id="admin-support-content">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading messages...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Reply Modal -->
    <div class="modal-overlay" id="reply-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Reply to Message</h2>
                <button class="modal-close" onclick="closeReplyModal()">&times;</button>
            </div>
            <input type="hidden" id="reply-message-id">
            <p style="margin-bottom:0.75rem;"><strong>From:</strong> <span id="reply-username"></span></p>
            <p style="margin-bottom:1rem;padding:0.75rem;background:var(--light-gray);border-radius:6px;color:var(--text);"><span id="reply-message-text"></span></p>
            <div class="form-group">
                <label for="reply-text">Your Reply</label>
                <textarea id="reply-text" rows="4" placeholder="Write your response..."></textarea>
            </div>
            <div style="display:flex;gap:1rem;margin-top:1.5rem;">
                <button class="btn btn-primary" onclick="sendReply()" style="flex:1;">Send Reply</button>
                <button class="btn btn-secondary" onclick="closeReplyModal()" style="flex:1;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/admin-support.js"></script>
</body>
</html>
