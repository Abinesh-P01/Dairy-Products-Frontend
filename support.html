<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Lumina</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img class="logo-icon" src="logo.jpg" alt="Lumina">
                Lumina
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="my-orders.html">My Orders</a>
                <a href="support.html" class="active">Support</a>
            </div>
            <div class="nav-actions">
                <span id="nav-auth-link"><a href="login.html">Login</a></span>
                <a href="admin/login.html" class="btn btn-sm btn-secondary">Admin</a>
                <a href="cart.html" class="cart-icon">
                    &#128722;
                    <span class="cart-badge">0</span>
                </a>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>Support</h1>
        <p>Need help? Send us a message and we'll get back to you</p>
    </div>

    <!-- Support Chat -->
    <section class="section">
        <div class="container">
            <div style="max-width:700px;margin:0 auto;">
                <!-- Messages -->
                <div id="support-messages" style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;min-height:300px;max-height:420px;overflow-y:auto;margin-bottom:1rem;">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading messages...</p>
                    </div>
                </div>

                <!-- New message form -->
                <div class="form-group">
                    <label for="support-message">Send a message</label>
                    <textarea id="support-message" rows="3" placeholder="Describe your issue..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="sendSupportMessage()" style="width:100%;">Send Message</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Lumina. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/user.js"></script>
    <script src="js/support.js"></script>
</body>
</html>
