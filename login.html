<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lumina</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img class="logo-icon" src="logo.jpg" alt="Lumina">
                Lumina
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="my-orders.html">My Orders</a>
                <a href="support.html">Support</a>
                <a href="index.html#about">About Us</a>
                <a href="index.html#contact">Contact</a>
            </div>
            <div class="nav-actions">
                <span id="nav-auth-link"><a href="login.html" class="active">Login</a></span>
                <a href="cart.html" class="cart-icon">
                    &#128722;
                    <span class="cart-badge">0</span>
                </a>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Page -->
    <section class="login-page">
        <div class="login-card">
            <h1><img src="./logo.jpg" alt="Lumina Dairy Products"> Lumina</h1>
            <p class="login-subtitle">Sign in to continue</p>

            <!-- Tabs -->
            <div class="login-tabs">
                <button type="button" class="login-tab active" data-tab="user" onclick="switchLoginTab('user')">User</button>
                <button type="button" class="login-tab" data-tab="admin" onclick="switchLoginTab('admin')">Admin</button>
            </div>

            <!-- User Login Panel -->
            <div id="user-panel" class="login-panel active">
                <form id="user-login-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="user-username">Username</label>
                        <input type="text" id="user-username" placeholder="Enter your username" autocomplete="username">
                        <div class="error-text">Username is required</div>
                    </div>
                    <div class="form-group">
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" placeholder="Enter your password" autocomplete="current-password">
                        <div class="error-text">Password is required</div>
                    </div>
                    <button type="submit" id="user-login-btn" class="btn btn-primary btn-lg">Login</button>
                </form>
                <div class="text-center mt-2">
                    <p style="color:var(--text-light);font-size:0.9rem;">
                        Don't have an account?
                        <a href="user-register.html" style="color:var(--primary);font-weight:600;">Register here</a>
                    </p>
                </div>
            </div>

            <!-- Admin Login Panel -->
            <div id="admin-panel" class="login-panel">
                <form id="admin-login-form" onsubmit="return false;">
                    <div class="form-group">
                        <label for="admin-username">Username</label>
                        <input type="text" id="admin-username" placeholder="Enter username" autocomplete="username">
                        <div class="error-text">Username is required</div>
                    </div>
                    <div class="form-group">
                        <label for="admin-password">Password</label>
                        <input type="password" id="admin-password" placeholder="Enter password" autocomplete="current-password">
                        <div class="error-text">Password is required</div>
                    </div>
                    <button type="submit" id="login-btn" class="btn btn-primary btn-lg">Login</button>
                </form>
            </div>

            <div class="text-center mt-1">
                <a href="index.html" style="color:var(--text-light);font-size:0.85rem;">&larr; Back to Store</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Lumina. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/user.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
